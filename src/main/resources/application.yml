spring:
  application:
    name: backend
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/haibau}
    username: ${DATABASE_USERNAME:postgres}
    password: ${DATABASE_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver
    hikari:
      # Supabase session pooler (free tier) caps at 15 clients TOTAL — a default
      # Hikari pool of 10 saturates it during rolling deploys (old+new instance)
      # and starves every DB request. Keep the pool small; single-instance app.
      maximum-pool-size: ${DB_MAX_POOL_SIZE:5}
      minimum-idle: ${DB_MIN_IDLE:1}
      max-lifetime: 300000
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        format_sql: true
  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration
  servlet:
    multipart:
      max-file-size: ${MULTIPART_MAX_FILE_SIZE:50MB}
      max-request-size: ${MULTIPART_MAX_REQUEST_SIZE:100MB}

server:
  port: ${PORT:8080}

image:
  processing:
    max-long-edge: ${IMAGE_MAX_LONG_EDGE:2560}
    max-dimension: ${IMAGE_MAX_DIMENSION:20000}
    max-pixels: ${IMAGE_MAX_PIXELS:100000000}

app:
  security:
    jwt:
      secret: ${JWT_SECRET}
      access-expiration: ${JWT_ACCESS_EXPIRATION:3600000}
      refresh-expiration: ${JWT_REFRESH_EXPIRATION:604800000}
  cloudinary:
    cloud-name: ${CLOUDINARY_CLOUD_NAME}
    api-key: ${CLOUDINARY_API_KEY}
    api-secret: ${CLOUDINARY_API_SECRET}
  upload:
    max-concurrent: ${UPLOAD_MAX_CONCURRENT:2}
    acquire-timeout-ms: ${UPLOAD_ACQUIRE_TIMEOUT_MS:15000}
  turnstile:
    enabled: ${TURNSTILE_ENABLED:true}
    secret-key: ${TURNSTILE_SECRET_KEY:}
    site-key: ${TURNSTILE_SITE_KEY}
  bank:
    code: ${BANK_CODE:MB}
    account-number: ${BANK_ACCOUNT_NUMBER:123456789}
    account-name: ${BANK_ACCOUNT_NAME:HAI BAU}
    deposit-amount: ${DEPOSIT_AMOUNT:500000}
  frontend:
    url: ${FRONTEND_URL:http://localhost:3000}
  admin:
    email: ${ADMIN_EMAIL:admin@haibau.com}
    initial-password: ${ADMIN_INITIAL_PASSWORD}

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html
    operationsSorter: method

logging:
  level:
    root: INFO
    com.photography.backend: ${LOG_LEVEL:INFO}
